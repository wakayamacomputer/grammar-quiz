<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<title>文法小テスト</title>
<style>
:root{--bg:#f6f7fb;--card:#fff;--fg:#1d2433;--sub:#5b6577;--line:#d5dae6;--pri:#2457c5;--prifg:#fff;--ok:#0b7a3b;--ng:#b3261e;--warn:#fff4d6;}
@media (prefers-color-scheme:dark){:root{--bg:#12151c;--card:#1c212c;--fg:#eef1f7;--sub:#a3acbd;--line:#363e50;--pri:#6b94ec;--priff:#10151f;--priff2:0;--ok:#5fd18a;--ng:#ff8a80;--warn:#3a3217;}
 .btn.pri{color:#10151f}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--fg);font-family:"Hiragino Sans","Yu Gothic",Meiryo,sans-serif;font-size:17px;line-height:1.6;
 -webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
#app{max-width:520px;margin:0 auto;padding:16px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px;margin-bottom:14px}
h1{font-size:22px;margin:4px 0 12px}
.note{background:var(--warn);border-radius:10px;padding:10px 12px;font-size:15px}
label{display:block;font-weight:bold;margin:12px 0 4px}
select,input{width:100%;font-size:18px;padding:12px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--fg);-webkit-user-select:text;user-select:text}
.btn{display:block;width:100%;font-size:19px;padding:15px;margin-top:10px;border:2px solid var(--line);border-radius:12px;background:var(--card);color:var(--fg);text-align:center;font-family:inherit}
.btn.pri{background:var(--pri);border-color:var(--pri);color:#fff;font-weight:bold}
.btn:disabled{opacity:.5}
.top{display:flex;justify-content:space-between;font-size:15px;color:var(--sub)}
.bar{height:12px;background:var(--line);border-radius:6px;overflow:hidden;margin:8px 0 14px}
.bar>div{height:100%;background:var(--pri);width:100%}
.bar.low>div{background:var(--ng)}
.sent{font-size:22px;line-height:2.1;margin:6px 0 16px}
.qtype{font-size:15px;color:var(--sub)}
.opt{font-size:20px;padding:16px}
table{width:100%;border-collapse:collapse;font-size:16px}
td,th{padding:6px 4px;border-bottom:1px solid var(--line);text-align:left}
.mk{font-weight:bold;font-size:20px;width:2.2em}
.mk.o{color:var(--ok)}.mk.x{color:var(--ng)}
textarea{width:100%;height:96px;font-size:13px;padding:8px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--fg);-webkit-user-select:text;user-select:text;word-break:break-all}
.score{font-size:40px;font-weight:bold;text-align:center}
.small{font-size:14px;color:var(--sub)}
</style>
</head>

<script>
// 共通関数（学生用アプリと先生用ページの両方に埋め込まれる）
function cyrb53(str, seed) {
  seed = seed || 0;
  var h1 = 0xdeadbeef ^ seed, h2 = 0x41c6ce57 ^ seed;
  for (var i = 0, ch; i < str.length; i++) {
    ch = str.charCodeAt(i);
    h1 = Math.imul(h1 ^ ch, 2654435761);
    h2 = Math.imul(h2 ^ ch, 1597334677);
  }
  h1 = Math.imul(h1 ^ (h1 >>> 16), 2246822507) ^ Math.imul(h2 ^ (h2 >>> 13), 3266489909);
  h2 = Math.imul(h2 ^ (h2 >>> 16), 2246822507) ^ Math.imul(h1 ^ (h1 >>> 13), 3266489909);
  return 4294967296 * (2097151 & h2) + (h1 >>> 0);
}
function mulberry32(a) {
  return function () {
    a |= 0; a = a + 0x6D2B79F5 | 0;
    var t = Math.imul(a ^ a >>> 15, 1 | a);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}
function toB64Url(str) {
  var bytes = new TextEncoder().encode(str), s = '';
  for (var i = 0; i < bytes.length; i++) s += String.fromCharCode(bytes[i]);
  return btoa(s).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
}
function fromB64Url(b) {
  b = b.replace(/-/g, '+').replace(/_/g, '/');
  while (b.length % 4) b += '=';
  var s = atob(b), bytes = new Uint8Array(s.length);
  for (var i = 0; i < s.length; i++) bytes[i] = s.charCodeAt(i);
  return new TextDecoder().decode(bytes);
}
function checkValue(payload) { return cyrb53(SALT + payload).toString(36); }
function makeCode(obj) {
  var p = toB64Url(JSON.stringify(obj));
  return 'KQ1.' + p + '.' + checkValue(p);
}
function readCode(code) {
  var m = /^KQ1\.([A-Za-z0-9_-]+)\.([a-z0-9]+)$/.exec(code.trim());
  if (!m) return null;
  var ok = checkValue(m[1]) === m[2], obj = null;
  try { obj = JSON.parse(fromB64Url(m[1])); } catch (e) { return null; }
  return { data: obj, ok: ok };
}

</script>

<script>
(function () {
'use strict';
var $app = document.getElementById('app');
var params = new URLSearchParams(location.search);
// 今週のテストを自動で選ぶ: ①?t=テストID があればそれ ②今日の日付が from〜until に入るテスト
// ③期間が始まっているもののうち一番新しいテスト ④どれもまだ始まっていなければ、まだ小テストはありません
function pickTest() {
  var byId = CFG.tests.filter(function (t) { return t.id === params.get('t'); })[0];
  if (byId) return byId;
  var d = new Date(), today = d.getFullYear() + '-' + ('0' + (d.getMonth() + 1)).slice(-2) + '-' + ('0' + d.getDate()).slice(-2);
  var dated = CFG.tests.filter(function (t) { return t.from; });
  if (!dated.length) return CFG.tests.filter(function (t) { return t.id === CFG.defaultTest; })[0] || CFG.tests[CFG.tests.length - 1];
  var now = dated.filter(function (t) { return t.from <= today && today <= (t.until || '9999-12-31'); })[0];
  if (now) return now;
  var started = dated.filter(function (t) { return t.from <= today; }).sort(function (a, b) { return a.from < b.from ? 1 : -1; })[0];
  return started || null;
}
var test = pickTest();
if (!test) {
  document.getElementById('app').innerHTML = '<div class="card"><h1>文法小テスト</h1><p>まだ 小テストは ありません。<br>先生の しじを まってください。</p></div>';
  throw new Error('no test yet');
}
var KEY = 'gq1:' + test.id;
var S = null, QS = null, timer = null, away = false, locked = false;

// ---- 問題データの復号（簡易難読化） ----
function loadQuestions() {
  var raw = atob(PACK), key = new TextEncoder().encode(SALT), b = new Uint8Array(raw.length);
  for (var i = 0; i < raw.length; i++) b[i] = raw.charCodeAt(i) ^ key[i % key.length];
  return JSON.parse(new TextDecoder().decode(b));
}
QS = loadQuestions();
var byId = {}; QS.forEach(function (q) { byId[q.id] = q; });

function load() { try { return JSON.parse(localStorage.getItem(KEY)); } catch (e) { return null; } }
function save() { try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) {} }
function esc(s) { return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;'); }
function shuffle(a, rnd) {
  a = a.slice();
  for (var i = a.length - 1; i > 0; i--) { var j = Math.floor(rnd() * (i + 1)); var t = a[i]; a[i] = a[j]; a[j] = t; }
  return a;
}

// ---- 学生ごとの出題（クラス＋学籍番号下4桁から決まる） ----
// 文法はUnitが積み上がらないので、その週のUnitの「共通7問」＋「パターン固有3問」をそのまま使う。
// パターン1/2は、学籍番号下4桁の末尾1桁の偶数/奇数で自動的に振り分ける
// （隣の席どうしは出席番号が連番になることが多いため、自然と別パターンになりやすい）。
function makePlan(cls, sid) {
  var rnd = mulberry32(cyrb53(test.id + '|' + cls + '|' + sid));
  var patternNum = (parseInt(sid.slice(-1), 10) % 2 === 0) ? 1 : 2;
  var pool = QS.filter(function (q) { return q.unit === test.unit && (q.scope === 'common' || q.scope === 'pattern' + patternNum + 'Only'); });
  var chosen = shuffle(pool, rnd);
  return chosen.map(function (q) { return { id: q.id, o: shuffle([0, 1, 2, 3], rnd) }; });
}
function opts(q) { return [q.answer].concat(q.w); }

// ---- 画面 ----
function startScreen() {
  var cls = CFG.classes.map(function (c) { return '<option>' + esc(c) + '</option>'; }).join('');
  $app.innerHTML = '<div class="card"><h1>' + esc(test.title) + '</h1>' +
    '<div class="note">・全部で <b>' + test.total + '問</b>。1問ごとに制限時間があります。<br>' +
    '・前の問題にはもどれません。<br>・教科書やスマホの他のアプリは見ません。<b>' + (test.onLeave === 'end' ? '画面をはなれると、その時点でテストが おわります。' : '画面をはなれると記録されます。') + '</b><br>' +
    '・テストは<b>1回だけ</b>です。</div>' +
    '<label>クラス</label><select id="cls"><option value="">えらんでください</option>' + cls + '</select>' +
    '<label>学籍番号の下4桁（すうじ）</label><input id="sid" inputmode="numeric" maxlength="4" placeholder="例：1234" autocomplete="off">' +
    '<div id="err" class="small" style="color:var(--ng);min-height:1.5em"></div>' +
    '<button class="btn pri" id="go">テストをはじめる</button></div>';
  document.getElementById('go').onclick = function () {
    var c = document.getElementById('cls').value, s = document.getElementById('sid').value.trim();
    if (!c) return err('クラスをえらんでください。');
    if (!/^\d{4}$/.test(s)) return err('学籍番号の下4桁を、すうじ4つで入れてください。');
    // ブラウザの確認ダイアログは「画面をはなれた」と誤検知されるため、画面の中で確認する
    $app.innerHTML = '<div class="card"><h1>これで いいですか？</h1><p style="font-size:20px">クラス：<b>' + esc(c) + '</b><br>学籍番号 下4桁：<b>' + esc(s) + '</b></p>' +
      '<div class="note">はじめると、やり直しは できません。</div>' +
      '<button class="btn pri" id="yes">はい、テストをはじめる</button><button class="btn" id="no">もどる</button></div>';
    document.getElementById('no').onclick = startScreen;
    document.getElementById('yes').onclick = function () {
      S = { cls: c, sid: s, plan: makePlan(c, s), i: 0, res: [], leaves: 0, lv: 0, t0: Date.now(), qs: 0, done: false };
      if (!S.plan.length) { S = null; startScreen(); return; }
      save(); showQ();
    };
  };
  function err(m) { document.getElementById('err').textContent = m; }
}

var graceUntil = 0;
function showQ() {
  clearInterval(timer); locked = false; graceUntil = Date.now() + 1500;
  if (S.i >= S.plan.length) return finish();
  var p = S.plan[S.i], q = byId[p.id], lim = test.timeLimit;
  if (!S.qs) { S.qs = Date.now(); S.lv = 0; save(); }
  var o = opts(q), shown = p.o.map(function (k) { return o[k]; });
  $app.innerHTML = '<div class="card"><div class="top"><span>第 ' + (S.i + 1) + ' 問 / ' + S.plan.length + '</span><span id="sec"></span></div>' +
    '<div class="bar" id="bar"><div id="fill"></div></div>' +
    '<div class="qtype">（　）に入る<b>ことば</b>をえらんでください</div>' +
    '<div class="sent">' + esc(q.sentence) + '</div>' +
    shown.map(function (t, i) { return '<button class="btn opt" data-i="' + i + '">' + esc(t) + '</button>'; }).join('') + '</div>';
  Array.prototype.forEach.call($app.querySelectorAll('.opt'), function (b) {
    b.onclick = function () { answer(+b.getAttribute('data-i')); };
  });
  function tick() {
    var left = lim - (Date.now() - S.qs) / 1000;
    if (left <= 0) { answer(-1); return; }
    document.getElementById('sec').textContent = '残り ' + Math.ceil(left) + ' 秒';
    document.getElementById('fill').style.width = (left / lim * 100) + '%';
    document.getElementById('bar').className = 'bar' + (left <= 5 ? ' low' : '');
  }
  tick(); timer = setInterval(tick, 100);
}

function answer(ch) {
  if (locked) return; locked = true; clearInterval(timer);
  var p = S.plan[S.i], q = byId[p.id];
  var ok = ch >= 0 && p.o[ch] === 0;
  if (ok && test.onLeave === 'wrong' && S.lv) ok = false;
  S.res.push({ ch: ch, ok: ok ? 1 : 0, lv: S.lv, t: Math.round((Date.now() - S.qs) / 100) / 10 });
  S.i++; S.qs = 0; S.lv = 0; save();
  setTimeout(showQ, 150);
}

function passed(score, n) { return score * 100 / n >= (test.passRate || 80); }
function finish() {
  if (!S.done) {
    S.done = true;
    var score = S.res.reduce(function (a, r) { return a + r.ok; }, 0);
    S.code = makeCode({
      t: test.id, c: S.cls, s: S.sid, sc: score, n: S.plan.length, pf: passed(score, S.plan.length) ? 1 : 0,
      a: S.res.map(function (r) { return r.ok; }).join(''),
      ch: S.res.map(function (r) { return r.ch < 0 ? 'x' : r.ch; }).join(''),
      lv: S.leaves, lq: S.res.map(function (r) { return r.lv ? 1 : 0; }).join(''),
      d: Math.round((Date.now() - S.t0) / 1000), q: S.plan.map(function (p) { return p.id; }).join(',')
    });
    save();
  }
  var score = S.res.reduce(function (a, r) { return a + r.ok; }, 0);
  var rows = S.res.map(function (r, i) {
    var q = byId[S.plan[i].id];
    return '<tr><td>' + (i + 1) + '</td><td class="mk ' + (r.ok ? 'o' : 'x') + '">' + (r.ok ? '○' : '×') + '</td><td>' +
      esc(q.answer) + (r.ch === -1 ? ' <span class="small">（時間切れ）</span>' : '') +
      (r.ch === -2 ? ' <span class="small">（テスト終了のため）</span>' : '') +
      (r.lv ? ' <span class="small">（画面をはなれた）</span>' : '') + '</td></tr>';
  }).join('');
  $app.innerHTML = '<div class="card"><h1>テストおわり</h1>' +
    (S.ended ? '<div class="note" style="margin-bottom:10px"><b>画面をはなれたので、テストが おわりました。</b> のこりの もんだいは ×です。</div>' : '') + '<div class="score">' + Math.round(score * 100 / S.plan.length) + ' 点</div>' +
    '<div style="text-align:center;font-size:15px;color:var(--sub)">（' + score + ' / ' + S.plan.length + ' 問せいかい）</div>' +
    (passed(score, S.plan.length)
      ? '<div class="note" style="margin:10px 0;text-align:center;font-size:20px;border:2px solid var(--ok)"><b style="color:var(--ok)">○ 合格</b></div>'
      : '<div class="note" style="margin:10px 0;text-align:center;font-size:20px;border:2px solid var(--ng)"><b style="color:var(--ng)">× 不合格</b><br><span style="font-size:15px">' + (test.passRate || 80) + '点に たりません。</span></div>') +
    '<p class="small" style="text-align:center">クラス ' + esc(S.cls) + ' ／ 下4桁 ' + esc(S.sid) + ' ／ 画面をはなれた回数：' + S.leaves + ' 回</p>' +
    '<table><tr><th>No.</th><th></th><th>正しい答え</th></tr>' + rows + '</table></div>' +
    (CFG.formsUrl
      ? '<div class="card"><h1>けっかを出す</h1><div class="note">下のボタンを おして、<b>Formsで「送信」</b>を おしてください。<br>入力は いりません。</div>' +
        '<button class="btn pri" id="send">① けっかを出す（Forms）</button>' +
        '<details style="margin-top:14px"><summary class="small">ボタンが ひらかないとき</summary>' +
        '<p class="small">下のコードをコピーして、先生に 見せてください。</p></details>' +
        '<textarea id="code" readonly>' + esc(S.code) + '</textarea>' +
        '<button class="btn" id="cp">コードをコピーする</button><div id="cpm" class="small"></div></div>'
      : '<div class="card"><h1>結果コード</h1><div class="note">下のコードを<b>ぜんぶコピー</b>して、先生に出してください。</div>' +
        '<textarea id="code" readonly>' + esc(S.code) + '</textarea>' +
        '<button class="btn pri" id="cp">コードをコピーする</button><div id="cpm" class="small"></div></div>');
  var sendBtn = document.getElementById('send');
  if (sendBtn) sendBtn.onclick = function () {
    var vals = {
      test: test.title, class: S.cls, id: S.sid, score: Math.round(score * 100 / S.plan.length), total: S.plan.length, result: passed(score, S.plan.length) ? '合格' : '不合格',
      answers: S.res.map(function (r) { return r.ok ? '○' : '×'; }).join(''),
      leaves: S.leaves,
      leaveQs: S.res.map(function (r, i) { return r.lv ? i + 1 : ''; }).filter(String).join(' '),
      time: Math.round((Date.now() - S.t0) / 1000), code: S.code
    };
    var u = CFG.formsUrl;
    if (u.indexOf('{class}') < 0 && u.toLowerCase().indexOf('%7bclass%7d') < 0) { // 選択肢の質問: 事前入力で選んだ1つ目のクラスを置き換える
      u = u.replace(new RegExp('=(%22)?' + encodeURIComponent(CFG.classes[0]) + '(%22)?(?=&|$)'),
        function (m, q1, q2) { return '=' + (q1 || '') + '{class}' + (q2 || ''); }); // 引用符(%22)は残す
    }
    Object.keys(vals).forEach(function (k) {
      var v = encodeURIComponent(String(vals[k]));
      u = u.split('{' + k + '}').join(v).split('%7B' + k + '%7D').join(v).split('%7b' + k + '%7d').join(v);
    });
    location.href = u;
  };
  document.getElementById('cp').onclick = function () {
    var t = document.getElementById('code'); t.select(); t.setSelectionRange(0, 99999);
    var m = document.getElementById('cpm');
    (navigator.clipboard ? navigator.clipboard.writeText(S.code) : Promise.reject()).then(
      function () { m.textContent = 'コピーしました。'; },
      function () { try { document.execCommand('copy'); m.textContent = 'コピーしました。'; } catch (e) { m.textContent = '長押ししてコピーしてください。'; } });
  };
}

// ---- 画面離脱の検知（1回はなれるごとに1回） ----
function leave(hard) {
  if (!S || S.done) return;
  if (!hard && Date.now() < graceUntil) return; // 画面の切り替わり直後のフォーカス移動は無視
  if (hard && test.onLeave === 'end') pendingEnd = true; // 戻ってきたときに終了（再読み込みでは終了しない）
  if (!away) { away = true; S.leaves++; S.lv = 1; save(); }
}
var pendingEnd = false;
function back() { away = false; if (pendingEnd && S && !S.done) { pendingEnd = false; forceEnd(); } }
// 「end」設定: 別のアプリに切り替えたら、その時点でテストを終了し、残りは不正解にする
function forceEnd() {
  clearInterval(timer);
  if (S.res.length < S.plan.length) S.res.push({ ch: -3, ok: 0, lv: 1, t: 0 });   // 離脱した問題
  while (S.res.length < S.plan.length) S.res.push({ ch: -2, ok: 0, lv: 0, t: 0 }); // 残り（出題されず）
  S.i = S.plan.length; S.ended = 1; S.qs = 0; save(); finish();
}
document.addEventListener('visibilitychange', function () { document.hidden ? leave(true) : back(); });
window.addEventListener('blur', function () { leave(false); }); // フォーカスが外れただけ（通知など）は記録のみ
window.addEventListener('focus', back);
document.addEventListener('contextmenu', function (e) { e.preventDefault(); });
document.addEventListener('copy', function (e) { if (e.target.id !== 'code') e.preventDefault(); });

// 先生用: 画面の下の小さい「先生用」を押して合言葉を入れると、このブラウザの受験記録を消す
var foot = document.createElement('div');
foot.style.cssText = 'text-align:center;margin:8px 0 24px;font-size:12px;opacity:.5';
foot.innerHTML = '<a href="#" id="tr" style="color:inherit">先生用</a>';
document.body.appendChild(foot);
document.getElementById('tr').onclick = function (e) {
  e.preventDefault();
  var c = prompt('先生用の合言葉を入れてください（受験記録を消します）');
  if (c && c === cyrb53(SALT + 'reset').toString(36).slice(0, 6)) {
    try { localStorage.removeItem(KEY); } catch (x) {}
    location.reload();
  } else if (c) { alert('合言葉がちがいます。'); }
};
// ---- 起動 ----
// 先生用: ?reset=合言葉 で、このブラウザの受験記録を消す（合言葉は build.py の最後に表示される）
if (params.get('reset') && params.get('reset') === cyrb53(SALT + 'reset').toString(36).slice(0, 6)) {
  try { localStorage.removeItem(KEY); } catch (e) {}
  try { history.replaceState(null, '', location.pathname + (params.get('t') ? '?t=' + params.get('t') : '')); } catch (e) {}
}
S = load();
if (S && S.done) finish();
else if (S && S.plan) { S.leaves++; S.lv = 1; save(); showQ(); } // 再読み込みも「離脱」として記録
else { S = null; startScreen(); }
})();
</script>
</body>
</html>
