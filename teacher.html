<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>文法小テスト 集計（先生用）</title>
<style>
:root{--bg:#f6f7fb;--card:#fff;--fg:#1d2433;--line:#d5dae6;--pri:#2457c5;--ng:#b3261e;--warn:#fff4d6}
@media (prefers-color-scheme:dark){:root{--bg:#12151c;--card:#1c212c;--fg:#eef1f7;--line:#363e50;--pri:#6b94ec;--ng:#ff8a80;--warn:#3a3217}}
body{margin:0;background:var(--bg);color:var(--fg);font-family:"Yu Gothic",Meiryo,sans-serif;padding:16px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px;margin:0 auto 14px;max-width:1100px}
textarea{width:100%;height:160px;font-size:13px;background:var(--bg);color:var(--fg);border:1px solid var(--line);border-radius:8px;padding:8px}
button{font-size:16px;padding:10px 18px;border-radius:8px;border:0;background:var(--pri);color:#fff;margin-right:8px}
table{border-collapse:collapse;width:100%;font-size:14px}th,td{border:1px solid var(--line);padding:5px 8px;text-align:left}
.ng{color:var(--ng);font-weight:bold}.warn{background:var(--warn);padding:8px 12px;border-radius:8px;margin:8px 0}
</style>
</head>
<body>
<div class="card"><h2>文法小テスト 集計（先生用）</h2>
<p>Formsの回答からコピーした「結果コード」を、1行に1つずつ貼ってください。</p>
<textarea id="in" placeholder="KQ1.xxxxx.yyyy"></textarea><br><br>
<button id="go">一覧にする</button><button id="dl" disabled>CSVをダウンロード</button>
<div id="msg"></div></div>
<div class="card"><table id="tb"></table></div>
<script>// 共通関数（学生用アプリと先生用ページの両方に埋め込まれる）
function cyrb53(str, seed) {
  seed = seed || 0;
  var h1 = 0xdeadbeef ^ seed, h2 = 0x41c6ce57 ^ seed;
  for (var i = 0, ch; i < str.length; i++) {
    ch = str.charCodeAt(i);
    h1 = Math.imul(h1 ^ ch, 2654435761);
    h2 = Math.imul(h2 ^ ch, 1597334677);
  }
  h1 = Math.imul(h1 ^ (h1 >>> 16), 2246822507) ^ Math.imul(h2 ^ (h2 >>> 13), 3266489909);
  h2 = Math.imul(h2 ^ (h2 >>> 16), 2246822507) ^ Math.imul(h1 ^ (h1 >>> 13), 3266489909);
  return 4294967296 * (2097151 & h2) + (h1 >>> 0);
}
function mulberry32(a) {
  return function () {
    a |= 0; a = a + 0x6D2B79F5 | 0;
    var t = Math.imul(a ^ a >>> 15, 1 | a);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}
function toB64Url(str) {
  var bytes = new TextEncoder().encode(str), s = '';
  for (var i = 0; i < bytes.length; i++) s += String.fromCharCode(bytes[i]);
  return btoa(s).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
}
function fromB64Url(b) {
  b = b.replace(/-/g, '+').replace(/_/g, '/');
  while (b.length % 4) b += '=';
  var s = atob(b), bytes = new Uint8Array(s.length);
  for (var i = 0; i < s.length; i++) bytes[i] = s.charCodeAt(i);
  return new TextDecoder().decode(bytes);
}
function checkValue(payload) { return cyrb53(SALT + payload).toString(36); }
function makeCode(obj) {
  var p = toB64Url(JSON.stringify(obj));
  return 'KQ1.' + p + '.' + checkValue(p);
}
function readCode(code) {
  var m = /^KQ1\.([A-Za-z0-9_-]+)\.([a-z0-9]+)$/.exec(code.trim());
  if (!m) return null;
  var ok = checkValue(m[1]) === m[2], obj = null;
  try { obj = JSON.parse(fromB64Url(m[1])); } catch (e) { return null; }
  return { data: obj, ok: ok };
}
</script>
<script>var SALT = "7b6fde40bf4342e1f686f960";</script>
<script>
var rows = [];
document.getElementById('go').onclick = function () {
  var lines = document.getElementById('in').value.split(/\r?\n/), seen = {}, msg = [];
  rows = [];
  lines.forEach(function (ln) {
    var m = /KQ1\.[A-Za-z0-9_-]+\.[a-z0-9]+/.exec(ln); if (!ln.trim()) return;
    if (!m) { msg.push('読み取れない行: ' + ln.slice(0, 30)); return; }
    var r = readCode(m[0]); if (!r) { msg.push('読み取れない行: ' + ln.slice(0, 30)); return; }
    var d = r.data, key = d.t + '|' + d.c + '|' + d.s;
    var lq = d.lq.split('').map(function (x, i) { return x === '1' ? i + 1 : null; }).filter(Boolean).join(' ');
    rows.push([d.t, d.c, d.s, Math.round(d.sc * 100 / d.n) + '点', d.pf ? '合格' : '不合格', d.a.split('').map(function (x) { return x === '1' ? '○' : '×'; }).join(''),
      d.lv, lq, d.d, r.ok ? 'OK' : 'NG', key]);
    seen[key] = (seen[key] || 0) + 1;
  });
  rows.forEach(function (r) { r.push(seen[r[10]] > 1 ? '重複' : ''); r.splice(10, 1); });
  var dup = Object.keys(seen).filter(function (k) { return seen[k] > 1; });
  if (dup.length) msg.push('同じクラス・学籍番号の重複があります: ' + dup.map(function (k) { return k.replace(/\|/g, ' / '); }).join(', '));
  if (rows.some(function (r) { return r[9] === 'NG'; })) msg.push('チェック値がNGの行があります（コードが書き換えられた可能性）。');
  document.getElementById('msg').innerHTML = msg.map(function (m) { return '<div class="warn">' + m.replace(/</g, '&lt;') + '</div>'; }).join('');
  var head = ['テストID', 'クラス', '学籍番号下4桁', '得点', '合否', '各問の正誤', '離脱回数', '離脱した問題', '所要時間(秒)', 'チェック', '重複'];
  var h = '<tr>' + head.map(function (x) { return '<th>' + x + '</th>'; }).join('') + '</tr>';
  rows.forEach(function (r) { h += '<tr>' + r.map(function (x, i) { return '<td' + ((i === 9 && x === 'NG') || (i === 10 && x) ? ' class="ng"' : '') + '>' + String(x).replace(/</g, '&lt;') + '</td>'; }).join('') + '</tr>'; });
  document.getElementById('tb').innerHTML = h;
  document.getElementById('dl').disabled = !rows.length;
  window._head = head;
};
document.getElementById('dl').onclick = function () {
  var csv = [window._head].concat(rows).map(function (r) {
    return r.map(function (x) { x = String(x); return /[",\n]/.test(x) ? '"' + x.replace(/"/g, '""') + '"' : x; }).join(',');
  }).join('\r\n');
  var a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob(['﻿' + csv], { type: 'text/csv;charset=utf-8' }));
  a.download = 'grammar-quiz-results.csv'; a.click();
};
</script>
</body>
</html>
